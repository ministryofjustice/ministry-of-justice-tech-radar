# Deploys the Tech Radar to production (tech-radar.justice.gov.uk).
# Triggered manually only — run from main when you're ready to release.
# See README for the full dev → prod workflow.

name: Deploy to GitHub Pages
run-name: Deploy Tech Radar to GitHub Pages

on:
  # No automatic trigger on push — prod deployments are intentional.
  # Use 'make deploy-prod' or trigger this workflow from the Actions tab.
  workflow_dispatch:

# Minimal top-level permissions; each job declares only what it needs.
permissions:
  contents: read

concurrency:
  group: github-pages
  # Never cancel an in-flight prod deployment — let it finish or fail cleanly.
  cancel-in-progress: false

jobs:
  guard:
    name: Branch guard
    runs-on: ubuntu-latest
    steps:
      # workflow_dispatch lets you pick any branch in the UI, so we enforce
      # main here as a second line of defence (the first is the GitHub
      # environment deployment branch restriction in repo settings).
      - name: Require main branch
        if: github.ref != 'refs/heads/main'
        run: |
          echo "Must be run from main (got ${{ github.ref }})"
          exit 1

  build:
    name: Build Tech Radar
    needs: guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          # NODE_VERSION is set as a repository variable so it can be updated
          # in one place without touching workflow files.
          node-version: ${{ vars.NODE_VERSION }}
          cache: npm

      # Verifies the integrity of the dependency graph before we build.
      # Required by MoJ DevSecOps standards.
      - name: SLSA supply chain protection
        uses: ministryofjustice/devsecops-actions/sca/slsa@4cd163be7859cd130800d6719d925318826038ea

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: build

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      # id-token is required for OIDC-based GitHub Pages deployment.
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5

      - name: Done
        run: echo "Deployed to ${{ steps.deployment.outputs.page_url }}"

  notify:
    name: Slack Notification
    runs-on: ubuntu-latest
    needs: deploy
    # Run regardless of deploy outcome so failures are also reported.
    if: always()
    steps:
      - name: Notify success
        if: needs.deploy.result == 'success'
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "✅ *Tech Radar production deployment succeeded*",
              "attachments": [{
                "color": "good",
                "fields": [
                  {"title": "Deployed by", "value": "${{ github.actor }}", "short": true},
                  {
                    "title": "Commit",
                    "value": "<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>",
                    "short": true
                  },
                  {
                    "title": "URL",
                    "value": "<https://tech-radar.justice.gov.uk|tech-radar.justice.gov.uk>",
                    "short": false
                  }
                ]
              }]
            }'

      - name: Notify failure
        if: needs.deploy.result != 'success'
        run: |
          curl -s -X POST "${{ secrets.SLACK_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d '{
              "text": "❌ *Tech Radar production deployment failed*",
              "attachments": [{
                "color": "danger",
                "fields": [
                  {"title": "Triggered by", "value": "${{ github.actor }}", "short": true},
                  {
                    "title": "Commit",
                    "value": "<https://github.com/${{ github.repository }}/commit/${{ github.sha }}|${{ github.sha }}>",
                    "short": true
                  },
                  {
                    "title": "Workflow run",
                    "value":"<https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|View logs>",
                    "short": false
                  }
                ]
              }]
            }'
